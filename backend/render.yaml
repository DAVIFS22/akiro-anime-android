services:
  - type: web
    name: akiro-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_API_READ_ACCESS_TOKEN
        sync: false
      - key: AKIRO_SOURCE_FEED_URL
        sync: false
      - key: AKIRO_SOURCE_FEED_TOKEN
        sync: false

  - key: AKIRO_ENABLE_TORRENTIO_SYNC
    sync: false
