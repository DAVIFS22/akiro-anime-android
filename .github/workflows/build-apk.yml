name: Build Akiro Anime APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace "-PTMDB_API_KEY=${TMDB_API_KEY}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: akiro-anime-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
